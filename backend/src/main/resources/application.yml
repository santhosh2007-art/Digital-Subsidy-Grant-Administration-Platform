spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/subsidydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

jwt:
  secret: subsidyadminSecretKeyForJwtTokenGeneration512BitsMinimumKeyNationalPortal2026
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7
